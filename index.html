<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BEARS CASINO</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<!-- HEADER -->
<header>
    <div>
        <div style="font-weight:900; font-size:18px; color:white;">BEARS CASINO</div>
        <div style="font-size:10px; color:var(--accent); font-weight:bold;">PET EVOLUTION</div>
    </div>

    <div class="bal-card">
        <span id="bal-val">0</span> BB
    </div>
</header>


<div class="container">

<!-- PET DISPLAY -->
<div id="pet-display" class="glass" style="display:flex; gap:15px; align-items:center;">
    <div id="p-img" style="font-size:45px;">🥚</div>

    <div style="flex:1">
        <div id="p-rarity" class="rarity-tag">НЕМАЄ</div>
        <div id="p-name" style="font-weight:bold;">Оберіть пета</div>

        <div class="xp-bar">
            <div id="xp-f" class="xp-fill"></div>
        </div>

        <div style="display:flex; justify-content:space-between; font-size:10px;">
            <span>x<span id="p-m">1.0</span></span>
            <span id="xp-num">0/1000</span>
            <span>LVL: <span id="p-l">1</span></span>
        </div>
    </div>
</div>


<!-- MAIN -->
<div id="v-main" class="page">

<div class="glass">

<select id="g-sel" onchange="updUI()">
    <option value="f50">⚖️ 50/50 (x1.55)</option>
    <option value="dice">🎲 Кубик (x2.05)</option>
    <option value="wheel">🎡 Колесо</option>
    <option value="bj">🃏 Блекджек</option>
</select>

<!-- DICE -->
<div id="ui-dice" style="display:none; margin:10px 0;">
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:5px;">
        <button class="btn-s" onclick="selN(1)">1</button>
        <button class="btn-s" onclick="selN(2)">2</button>
        <button class="btn-s" onclick="selN(3)">3</button>
        <button class="btn-s" onclick="selN(4)">4</button>
        <button class="btn-s" onclick="selN(5)">5</button>
        <button class="btn-s" onclick="selN(6)">6</button>
    </div>
</div>

<!-- WHEEL -->
<div id="ui-wheel" style="display:none; text-align:center; margin:10px 0;">
    <div class="w-wrap">
        <div class="marker">▼</div>
        <div id="w-obj" class="w-main">
            <div class="w-sec" style="transform:rotate(0deg);background:#ff4757">0</div>
            <div class="w-sec" style="transform:rotate(90deg);background:#2ed573">x1.4</div>
            <div class="w-sec" style="transform:rotate(180deg);background:#ffa502">x1.6</div>
            <div class="w-sec" style="transform:rotate(270deg);background:#1e90ff">x1.8</div>
        </div>
    </div>
</div>

<!-- BLACKJACK -->
<div id="ui-bj" style="display:none; text-align:center; margin:10px 0;">
    <div id="bj-dc" class="card-row"></div>
    <div id="bj-pc" class="card-row"></div>

    <div id="bj-ctrl" style="display:none; gap:10px; justify-content:center;">
        <button class="btn-s" onclick="bjDo('hit')">ЩЕ</button>
        <button class="btn-s" style="background:var(--error)" onclick="bjDo('stop')">СТОП</button>
    </div>
</div>

<input type="number" id="bet-a" value="1" step="0.1">
<button class="btn" onclick="play()">ГРАТИ</button>

<div id="g-stat"></div>

</div>
</div>


<!-- SHOP -->
<div id="v-shop" class="page" style="display:none">

<div class="shop-tabs">
    <div class="s-tab active" onclick="setShop('cases',this)">📦 Кейси</div>
    <div class="s-tab" onclick="setShop('market',this)">🛒 Ринок</div>
</div>

<div id="shop-list"></div>

</div>


<!-- INVENTORY -->
<div id="v-inv" class="page" style="display:none">
<div class="glass">
    <h3>🎒 ВАШІ ПЕТИ</h3>
    <div id="inv-list"></div>
</div>
</div>


<!-- TOP -->
<div id="v-top" class="page" style="display:none">
<div class="glass">
    <h3>🏆 ЛІДЕРИ</h3>
    <div id="leaderboard"></div>
</div>
</div>


<!-- ADMIN -->
<div id="v-admin" class="page" style="display:none">
<div id="admin-list"></div>
</div>

</div>


<!-- NAV -->
<nav>
    <div class="nav-tab active" onclick="tab('main',this)">🎮</div>
    <div class="nav-tab" onclick="tab('shop',this)">📦</div>
    <div class="nav-tab" onclick="tab('inv',this)">🎒</div>
    <div class="nav-tab" onclick="tab('top',this)">🏆</div>
    <div id="admin-tab" class="nav-tab" style="display:none" onclick="tab('admin',this)">⚡</div>
</nav>


<!-- 🎰 CASE OPEN ANIMATION -->
<div id="case-open" style="
position:fixed;
top:0; left:0;
width:100%; height:100%;
background:rgba(0,0,0,0.9);
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:999;
">

<div style="color:white; margin-bottom:10px;">🎁 ВІДКРИТТЯ КЕЙСА</div>

<div style="width:90%; overflow:hidden; border:2px solid white; border-radius:10px;">
    <div id="case-line" style="display:flex;"></div>
</div>

<div id="case-result" style="margin-top:15px;"></div>

</div>


<script src="script.js"></script>
</body>
</html>
