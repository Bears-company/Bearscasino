<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>BEARS CASINO v4</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<header>
    <div class="brand-zone">
        <div class="logo">BEARS CASINO</div>
        <div id="u-status" class="badge">SESSION OK</div>
    </div>
    <div class="wallet"><span id="bal-val">0</span> <small>BB</small></div>
</header>

<div class="container">
    <div class="glass pet-card-fixed">
        <div id="p-img" class="p-icon">🥚</div>
        <div class="p-info">
            <div class="p-top-line"><span id="p-name">Завантаження...</span> <span id="p-rarity" class="tag">???</span></div>
            <div class="p-bar"><div id="xp-f" class="p-fill"></div></div>
            <div class="p-stats">
                <span>LVL: <b id="p-l">1</b></span>
                <span>x<b id="p-m">1.0</b></span>
                <span id="xp-num">0/0</span>
            </div>
        </div>
    </div>

    <div id="v-main" class="page">
        <div class="glass">
            <select id="g-sel" class="game-select" onchange="switchGameUI()">
                <option value="f50">⚖️ Шанс 50/50</option>
                <option value="dice">🎲 Кубик</option>
                <option value="wheel">🎡 Колесо</option>
            </select>

            <div id="ui-dice" class="g-area" style="display:none">
                <div class="dice-selector">
                    <button class="d-btn active" onclick="setDice(1, this)">1</button>
                    <button class="d-btn" onclick="setDice(2, this)">2</button>
                    <button class="d-btn" onclick="setDice(3, this)">3</button>
                    <button class="d-btn" onclick="setDice(4, this)">4</button>
                    <button class="d-btn" onclick="setDice(5, this)">5</button>
                    <button class="d-btn" onclick="setDice(6, this)">6</button>
                </div>
            </div>

            <div id="ui-wheel" class="g-area" style="display:none">
                <div class="wheel-box">
                    <div class="pointer">▼</div>
                    <div id="w-obj" class="wheel-disk">
                        <div class="seg s1">x0</div><div class="seg s2">x2</div><div class="seg s3">x0.5</div>
                        <div class="seg s4">x1.5</div><div class="seg s5">x0</div>
                    </div>
                </div>
            </div>

            <div class="bet-container">
                <input type="number" id="bet-a" value="10" class="bet-input">
                <button class="play-btn" onclick="runGame()">ГРАТИ</button>
            </div>
            <div id="g-res" class="res-box"></div>
        </div>
    </div>

    <div id="v-shop" class="page" style="display:none">
        <div class="shop-nav">
            <button id="s-cases-btn" class="s-tab active" onclick="openShopPart('cases')">КЕЙСИ</button>
            <button id="s-market-btn" class="s-tab" onclick="openShopPart('market')">РИНОК</button>
        </div>
        
        <div id="part-cases" class="shop-content">
            <div class="glass shop-item">
                <span>📦 Basic Case</span>
                <button onclick="alert('Купівля...')">250 BB</button>
            </div>
        </div>

        <div id="part-market" class="shop-content" style="display:none">
            <div id="market-list"></div>
        </div>
    </div>

    <div id="v-admin" class="page" style="display:none">
        <div class="glass admin-box">
            <h3 style="color:var(--accent)">ADMIN DASHBOARD</h3>
            <div id="admin-users-list"></div>
        </div>
    </div>
</div>

<nav>
    <div class="nav-btn active" onclick="tab('main', this)">🎮</div>
    <div class="nav-btn" onclick="tab('shop', this)">📦</div>
    <div class="nav-btn" onclick="tab('top', this)">🏆</div>
    <div id="adm-nav" class="nav-btn adm-icon" style="display:none" onclick="tab('admin', this)">⚡</div>
</nav>

<script src="script.js"></script>
</body>
</html>
