<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>BEARS CASINO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<header>
    <div class="user-info">
        <div class="brand">BEARS CASINO</div>
        <div id="u-status" class="status-tag">ACTIVE SESSION</div>
    </div>
    <div class="bal-card"><span id="bal-val">0</span> <small>BB</small></div>
</header>

<div class="container">
    <div class="glass pet-header">
        <div id="p-img" class="pet-avatar">🥚</div>
        <div class="pet-details">
            <div class="name-row"><span id="p-name">Оберіть пета</span> <span id="p-rarity" class="r-tag">???</span></div>
            <div class="xp-container"><div id="xp-f" class="xp-fill"></div></div>
            <div class="stats-row">
                <span>LVL: <b id="p-l">1</b></span>
                <span>MUL: <b id="p-m">1.0</b></span>
                <span id="xp-num">0/1000</span>
            </div>
        </div>
    </div>

    <div id="v-main" class="page">
        <div class="glass game-box">
            <select id="g-sel" class="modern-select" onchange="updUI()">
                <option value="f50">⚖️ Шанс 50/50 (x1.55)</option>
                <option value="dice">🎲 Гра в кості (x2.05)</option>
                <option value="wheel">🎡 Колесо удачі (x0-x2)</option>
                <option value="bj">🃏 Блекджек (x2.0)</option>
            </select>

            <div id="ui-dice" style="display:none;" class="game-ui">
                <div class="dice-grid">
                    <button class="d-btn" onclick="selN(1, this)">1</button><button class="d-btn" onclick="selN(2, this)">2</button><button class="d-btn" onclick="selN(3, this)">3</button>
                    <button class="d-btn" onclick="selN(4, this)">4</button><button class="d-btn" onclick="selN(5, this)">5</button><button class="d-btn" onclick="selN(6, this)">6</button>
                </div>
            </div>

            <div id="ui-wheel" style="display:none;" class="game-ui wheel-container">
                <div class="wheel-pointer">▼</div>
                <div id="w-obj" class="wheel-canvas">
                    <div class="w-s s1">x0</div><div class="w-s s2">x2</div><div class="w-s s3">x0.5</div><div class="w-s s4">x1.5</div><div class="w-s s5">x0</div>
                </div>
            </div>

            <div class="input-group">
                <label>ВАША СТАВКА:</label>
                <input type="number" id="bet-a" value="10" min="1">
            </div>
            <button class="btn-play" onclick="play()">ГРАТИ ЗАРАЗ</button>
            <div id="g-stat" class="result-display"></div>
        </div>
    </div>

    <div id="v-shop" class="page" style="display:none">
        <div class="tab-switcher">
            <button id="btn-cases" class="tab-btn active" onclick="switchShop('cases')">📦 КЕЙСИ</button>
            <button id="btn-market" class="tab-btn" onclick="switchShop('market')">🛒 РИНОК</button>
        </div>
        
        <div id="shop-cases" class="shop-section">
            <div class="glass market-item">
                <div class="item-info"><b>Common Case 🐾</b><br><small>Шанс на пета x1.05-1.1</small></div>
                <button class="buy-btn" onclick="buyCase('basic')">250 BB</button>
            </div>
        </div>

        <div id="shop-market" class="shop-section" style="display:none">
            <div id="market-list"></div>
        </div>
    </div>

    <div id="v-inv" class="page" style="display:none">
        <div class="glass">
            <h3>🎒 ТВОЇ ПЕТИ</h3>
            <div id="inv-list" class="inv-grid"></div>
        </div>
    </div>

    <div id="v-admin" class="page" style="display:none">
        <div class="glass admin-panel">
            <h3 style="color:var(--accent)">⚡ BEARS ADMIN CONSOLE</h3>
            <div id="admin-users"></div>
        </div>
    </div>
</div>

<nav>
    <div class="nav-item active" onclick="tab('main', this)">🎮</div>
    <div class="nav-item" onclick="tab('shop', this)">📦</div>
    <div class="nav-item" onclick="tab('inv', this)">🎒</div>
    <div class="nav-item" onclick="tab('top', this)">🏆</div>
    <div id="adm-btn" class="nav-item admin-only" style="display:none" onclick="tab('admin', this)">⚡</div>
</nav>

<script src="script.js"></script>
</body>
</html>
