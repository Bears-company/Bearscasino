<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>BEARS CASINO</title>
    <link rel="stylesheet" href="style.css?v=3.1">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<header>
    <div>
        <div style="font-weight:900; font-size:18px; color:white; letter-spacing:1px">BEARS CASINO</div>
    </div>
    <div class="bal-card"><span id="bal-val">0</span> BB</div>
</header>

<div class="container">
    
    <div class="glass" style="display:flex; align-items:center; gap:15px; border-left: 5px solid var(--accent); position:relative; overflow:hidden">
        <div id="p-img" style="font-size:45px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2))">🥚</div>
        <div style="flex:1">
            <div id="p-rarity" style="font-size:9px; padding:2px 8px; border-radius:5px; display:inline-block; background:#333; font-weight:900; color:white">НЕМАЄ</div>
            <div id="p-name" style="font-weight:bold; margin-top:4px; font-size:16px">Обери пета</div>
            
            <div class="xp-bar">
                <div id="xp-f" class="xp-fill" style="width:0%"></div>
            </div>
            
            <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:600">
                <span style="color:var(--accent)">БОНУС: x<span id="p-m">1.000</span></span>
                <span style="color:#8d99ae">XP → LVL <span id="p-l">1</span></span>
            </div>
        </div>
    </div>

    <div id="v-main" class="page">
        <div class="glass">
            <label style="font-size:12px; font-weight:bold; color:#8d99ae; margin-left:5px">ОБЕРИ ГРУ</label>
            <select id="g-sel" onchange="updUI()">
                <option value="f50">⚖️ 50/50 (x1.55)</option>
                <option value="dice">🎲 Кубик (x2.05)</option>
                <option value="wheel">🎡 Колесо (До x1.8)</option>
                <option value="bj">🃏 Блекджек (x2.0)</option>
            </select>
            
            <div id="ui-dice" style="display:none; margin:15px 0;">
                <div class="dice-grid"></div>
            </div>
            
            <div id="ui-wheel" style="display:none; text-align:center">
                <div class="w-wrap">
                    <div class="marker"></div>
                    <div id="w-obj" class="w-main"></div>
                </div>
                <div style="display:flex; justify-content:center; gap:12px; font-size:11px; font-weight:bold; margin-bottom:10px">
                    <span style="color:var(--error)">🔴 0x</span>
                    <span style="color:var(--success)">🟢 1.4x</span>
                    <span style="color:#3b82f6">🔵 1.6x</span>
                    <span style="color:var(--warning)">🟡 1.8x</span>
                </div>
            </div>

            <div id="ui-bj" style="display:none; text-align:center; margin:15px 0; background: rgba(0,0,0,0.2); padding:15px; border-radius:12px">
                <div style="font-size:10px; color:#8d99ae; margin-bottom:5px">ДИЛЕР</div>
                <div id="bj-dc" style="display:flex; justify-content:center; gap:8px; margin-bottom:15px"></div>
                
                <div style="font-size:10px; color:#8d99ae; margin-bottom:5px">ВАШІ КАРТИ</div>
                <div id="bj-pc" style="display:flex; justify-content:center; gap:8px"></div>
                
                <div id="bj-ctrl" style="display:none; gap:10px; margin-top:20px; justify-content:center">
                    <button class="btn-s" onclick="bjDo('hit')" style="background:var(--accent); min-width:80px">ЩЕ</button>
                    <button class="btn-s" onclick="bjDo('stop')" style="background:var(--error); min-width:80px">СТОП</button>
                </div>
            </div>

            <label style="font-size:12px; font-weight:bold; color:#8d99ae; margin-left:5px">ВАША СТАВКА</label>
            <input type="number" id="bet-a" value="1" step="0.1" inputmode="decimal">
            
            <button class="btn" onclick="play()">ЗРОБИТИ СТАВКУ</button>
            
            <div id="g-stat" style="text-align:center; margin-top:15px; font-weight:bold; min-height:45px; font-size:16px"></div>
        </div>
    </div>

    <div id="v-shop" class="page" style="display:none">
        <div id="shop-list">
            </div>
    </div>

    <div id="v-inv" class="page" style="display:none">
        <div class="glass">
            <h3 style="margin-top:0">🎒 ВАШІ ПЕТИ</h3>
            <div id="inv-list"></div>
        </div>
    </div>

    <div id="v-top" class="page" style="display:none">
        <div class="glass">
            <h3 style="margin-top:0; color:var(--warning)">🏆 ЛІДЕРИ BEARS</h3>
            <div id="leaderboard"></div>
        </div>
    </div>

    <div id="v-admin" class="page" style="display:none">
        <div class="glass">
            <h3 style="margin-top:0; color:var(--accent)">⚡ КЕРУВАННЯ</h3>
            <div id="admin-list"></div>
        </div>
    </div>
</div>

<div id="case-modal">
    <h2 id="case-title" style="margin-bottom:20px; text-shadow: 0 0 10px var(--accent)">ВІДКРИВАЄМО...</h2>
    
    <div class="case-roulette">
        <div style="position:absolute; left:50%; top:0; width:2px; height:100%; background:white; z-index:10; opacity:0.5"></div>
        <div id="case-scroll"></div>
    </div>
    
    <div id="case-res" style="margin-top:25px; font-size:20px; font-weight:bold; text-align:center"></div>
    
    <button class="btn" style="width:200px; display:none; margin-top:20px; background:var(--success)" id="case-close" onclick="closeCase()">ЗАБРАТИ В ІНВЕНТАР</button>
</div>

<nav>
    <div class="nav-tab active" onclick="tab('main', this)">🎮</div>
    <div class="nav-tab" onclick="tab('shop', this)">📦</div>
    <div class="nav-tab" onclick="tab('inv', this)">🎒</div>
    <div class="nav-tab" onclick="tab('top', this)">🏆</div>
    <div id="admin-tab" class="nav-tab" style="display:none" onclick="tab('admin', this)">⚡</div>
</nav>

<script src="script.js?v=3.1"></script>
</body>
</html>
