<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>BEARS CASINO</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body>

<header>
    <div>
        <div id="u-name" style="font-weight:900; font-size:18px">BEARS CASINO</div>
        <div id="u-rank" style="font-size:10px; color:#8d99ae">РАНГ: 1</div>
    </div>
    <div class="bal-card"><span id="bal-val">5000</span> BB</div>
</header>

<div class="container">
    <div class="glass shadow-accent" style="display:flex; align-items:center; gap:15px; margin-bottom:10px">
        <div id="p-img" style="font-size:40px">🥚</div>
        <div style="flex:1">
            <div id="p-rarity">НЕМАЄ</div>
            <div id="p-name" style="font-weight:bold">Твій Пет</div>
            <div class="xp-bar"><div id="xp-f" class="xp-fill"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:12px">
                <span>Бонус: <span id="p-m" style="color:var(--accent)">x1.0</span></span>
                <span>Lvl: <span id="p-l">1</span></span>
            </div>
        </div>
    </div>

    <div id="v-main" class="page">
        <div class="glass">
            <select id="g-sel" onchange="updUI()">
                <option value="f50">⚖️ 50/50 (x1.45)</option>
                <option value="dice">🎲 Кубик (1-6) - x1.45</option>
                <option value="wheel">🎡 Колесо (0 - x1.75)</option>
                <option value="bj">🃏 Блекджек (x2.0)</option>
            </select>

            <div id="ui-dice" style="display:none; margin:15px 0; text-align:center">
                <p style="font-size:12px; color:#8d99ae">Обери число:</p>
                <div class="dice-grid">
                    <button class="n-btn active" onclick="selN(1, this)">1</button>
                    <button class="n-btn" onclick="selN(2, this)">2</button>
                    <button class="n-btn" onclick="selN(3, this)">3</button>
                    <button class="n-btn" onclick="selN(4, this)">4</button>
                    <button class="n-btn" onclick="selN(5, this)">5</button>
                    <button class="n-btn" onclick="selN(6, this)">6</button>
                </div>
            </div>

            <div id="ui-wheel" style="display:none; text-align:center">
                <div class="w-wrap"><div class="marker"></div><div id="w-obj" class="w-main"></div></div>
                <div style="font-size:11px; color:#8d99ae; margin-top:5px">🔴0 | 🟢x1.25 | 🔵x1.5 | 🟡x1.75</div>
            </div>

            <div id="ui-bj" style="display:none; margin:20px 0; text-align:center">
                <div id="bj-dc" class="card-row"></div>
                <div style="height:1px; background:var(--border); margin:15px 0"></div>
                <div id="bj-pc" class="card-row"></div>
                <div id="bj-ctrl" style="display:none; gap:10px; margin-top:15px">
                    <button class="btn" style="flex:1" onclick="bjDo('hit')">ЩЕ</button>
                    <button class="btn" style="flex:1; background:var(--error)" onclick="bjDo('stand')">СТОП</button>
                </div>
            </div>

            <input type="number" id="bet-a" value="100">
            <button class="btn" id="b-play" onclick="play()">СТАВКА</button>
            <div id="g-stat" style="text-align:center; margin-top:15px; font-weight:900; min-height:24px"></div>
        </div>
    </div>

    <div id="v-shop" class="page" style="display:none">
        <div class="glass">
            <h3 style="margin:0 0 15px 0">🛒 МАГАЗИН</h3>
            <div class="shop-item"><div>Дерев'яне Яйце</div><button class="btn-s" onclick="buy('egg_wood', 1000)">1k</button></div>
            <div class="shop-item"><div>Залізне Яйце</div><button class="btn-s" onclick="buy('egg_iron', 5000)">5k</button></div>
            <div class="shop-item"><div>Діамантове Яйце</div><button class="btn-s" onclick="buy('egg_diamond', 20000)">20k</button></div>
        </div>
    </div>

    <div id="v-top" class="page" style="display:none">
        <div class="glass"><h3>🏆 ТОП</h3><div id="leaderboard">...</div></div>
    </div>
</div>

<nav>
    <div class="nav-tab active" onclick="tab('main', this)">🎮 Гра</div>
    <div class="nav-tab" onclick="tab('shop', this)">🥚 Шоп</div>
    <div class="nav-tab" onclick="tab('top', this)">🏆 Топ</div>
</nav>

<script src="script.js"></script>
</body>
</html>
