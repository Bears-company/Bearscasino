<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>BEARS CASINO</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body>

<header>
    <div>
        <div id="u-name" style="font-weight:900; font-size:18px">BEARS CASINO</div>
        <div id="u-rank" style="font-size:10px; color:#8d99ae">РАНГ: 1</div>
    </div>
    <div class="bal-card"><span id="bal-val">5000</span> BB</div>
</header>

<div class="container">
    <div id="v-main" class="page">
        <div class="glass" style="display:flex; align-items:center; gap:15px; margin-bottom:10px">
            <div id="p-img" style="font-size:45px">🥚</div>
            <div style="flex:1">
                <div id="p-rarity" style="font-size:9px; font-weight:900; background:#94a3b8; color:#000; padding:2px 6px; border-radius:4px; display:inline-block">ПУСТО</div>
                <div id="p-name" style="font-weight:900; font-size:16px">Твій Пет</div>
                <div class="xp-bar"><div id="xp-f" class="xp-fill"></div></div>
                <div style="display:flex; justify-content:space-between; font-size:11px">
                    <span>Бонус: <span id="p-m" style="color:var(--accent)">x1.0</span></span>
                    <span>Lvl: <span id="p-l">1</span></span>
                </div>
            </div>
        </div>

        <div class="glass" style="text-align:center">
            <select id="g-sel" onchange="updUI()">
                <option value="dice">🎲 Кубик</option>
                <option value="wheel">🎡 Колесо</option>
            </select>
            <div id="ui-wheel" style="display:none"><div class="w-wrap"><div class="marker"></div><div id="w-obj" class="w-main"></div></div></div>
            <input type="number" id="bet-a" value="100">
            <button class="btn" id="b-play" onclick="play()">ГРАТИ</button>
            <div id="g-stat" style="margin-top:10px; font-weight:900; min-height:20px"></div>
        </div>
    </div>

    <div id="v-shop" class="page" style="display:none">
        <div class="glass">
            <h3>🛒 МАГАЗИН</h3>
            <div class="shop-item"><div>Дерев'яне Яйце</div><button class="btn" style="width:auto" onclick="buy('egg_wood', 1000)">1k</button></div>
            <div class="shop-item"><div>Залізне Яйце</div><button class="btn" style="width:auto; background:#94a3b8" onclick="buy('egg_iron', 5000)">5k</button></div>
            <div class="shop-item"><div>Діамантове Яйце</div><button class="btn" style="width:auto; background:var(--rare)" onclick="buy('egg_diamond', 20000)">20k</button></div>
        </div>
    </div>

    <div id="v-top" class="page" style="display:none">
        <div class="glass"><h3>🏆 ТОП</h3><div id="leaderboard">...</div></div>
    </div>
</div>

<nav>
    <div class="nav-tab active" onclick="tab('main', this)">🎮 Гра</div>
    <div class="nav-tab" onclick="tab('shop', this)">🥚 Шоп</div>
    <div class="nav-tab" onclick="tab('top', this)">🏆 Топ</div>
</nav>

<script src="script.js"></script>
</body>
</html>
