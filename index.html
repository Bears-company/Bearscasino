<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <header>
        <div class="user-info">
            <b id="u-rank">LVL: 1</b>
            <div class="xp-bar"><div id="xp-f" class="xp-fill"></div></div>
        </div>
        <div class="bal-card"><span id="bal-val">0</span> BB</div>
    </header>

    <div class="container">
        <div id="v-main" class="page">
            <div class="glass">
                <span id="p-img" style="font-size:40px">❓</span>
                <b id="p-name">Немає пета</b> | x<span id="p-m">1.000</span> | Lvl: <span id="p-l">1</span>
                <div id="p-rarity" style="padding:2px 5px; border-radius:5px; font-size:10px; display:inline-block"></div>
            </div>
            <div class="glass">
                <select id="g-sel"><option value="f50">50/50</option><option value="dice">Кубик</option></select>
                <input type="number" id="bet-a" value="10">
                <button class="btn" onclick="play()">ГРАТИ</button>
                <div id="g-stat"></div>
            </div>
        </div>

        <div id="v-inv" class="page" style="display:none">
            <h3>Інвентар</h3>
            <div id="inv-list"></div>
        </div>

        <div id="v-admin" class="page" style="display:none">
            <div class="admin-tabs">
                <button onclick="setATab('main')">Головна</button>
                <button onclick="setATab('stats')">Статистика</button>
                <button onclick="setATab('users')">Гравці</button>
            </div>
            <div id="a-sec-main"><div id="global-stats"></div></div>
            <div id="a-sec-stats" style="display:none"></div>
            <div id="a-sec-users" style="display:none">
                <input type="text" id="user-search" oninput="searchUser()" placeholder="ID...">
                <div id="user-inspect-res"></div>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-tab active" onclick="tab('main', this)">🎮</div>
        <div class="nav-tab" onclick="tab('inv', this)">📦</div>
        <div id="admin-tab" class="nav-tab" style="display:none" onclick="tab('admin', this)">⚙️</div>
    </nav>

    <script>
        // ВСТАВ СВІЙ CONFIG FIREBASE ТУТ
        firebase.initializeApp({ /* Твій конфіг */ });
    </script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
