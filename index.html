<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>BEARS CASINO</title>
    <link rel="stylesheet" href="style.css?v=2.6">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<header>
    <div>
        <div style="font-weight:900; font-size:18px">BEARS CASINO</div>
        <div id="u-rank" style="font-size:10px; color:#8d99ae; font-weight:bold">РАНГ: 1</div>
    </div>
    <div class="bal-card"><span id="bal-val">10</span> BB</div>
</header>

<div class="container">
    <div class="glass" style="display:flex; align-items:center; gap:15px; border-left: 5px solid var(--accent)">
        <div id="p-img" style="font-size:45px">🥚</div>
        <div style="flex:1">
            <div id="p-rarity" style="font-size:10px; padding:2px 8px; border-radius:5px; display:inline-block; background:#333; font-weight:bold">НЕМАЄ</div>
            <div id="p-name" style="font-weight:bold; margin-top:4px">Обери пета</div>
            <div class="xp-bar"><div id="xp-f" class="xp-fill" style="width:0%"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:12px">
                <span style="color:var(--accent)">x<span id="p-m">1.0</span></span>
                <span>Lvl: <span id="p-l">1</span></span>
            </div>
        </div>
    </div>

    <div id="v-main" class="page">
        <div class="glass">
            <select id="g-sel" onchange="updUI()">
                <option value="f50">⚖️ 50/50 (x1.45)</option>
                <option value="dice">🎲 Кубик (x1.45)</option>
                <option value="wheel">🎡 Колесо (До x1.75)</option>
                <option value="bj">🃏 Блекджек (x2.0)</option>
            </select>
            
            <div id="ui-dice" style="display:none;"><div class="dice-grid"></div></div>
            
            <div id="ui-wheel" style="display:none; text-align:center">
                <div class="w-wrap"><div class="marker"></div><div id="w-obj" class="w-main"></div></div>
                <div class="w-legend">
                    <div class="leg-item"><div class="dot" style="background:var(--error)"></div> 0x</div>
                    <div class="leg-item"><div class="dot" style="background:var(--success)"></div> 1.25x</div>
                    <div class="leg-item"><div class="dot" style="background:#3b82f6"></div> 1.5x</div>
                    <div class="leg-item"><div class="dot" style="background:#f59e0b"></div> 1.75x</div>
                </div>
            </div>

            <div id="ui-bj" style="display:none; text-align:center; margin:15px 0;">
                <div id="bj-dc" style="display:flex; justify-content:center; gap:5px; margin-bottom:10px"></div>
                <div id="bj-pc" style="display:flex; justify-content:center; gap:5px"></div>
                <div id="bj-ctrl" style="display:none; gap:10px; margin-top:10px; justify-content:center"><button class="btn-s" onclick="bjDo('hit')">ЩЕ</button><button class="btn-s" onclick="bjDo('stop')" style="background:var(--error)">СТОП</button></div>
            </div>

            <input type="number" id="bet-a" value="10" inputmode="numeric">
            <button class="btn" onclick="play()">ГРАТИ</button>
            <div id="g-stat" style="text-align:center; margin-top:15px; font-weight:bold; min-height:45px"></div>
        </div>
    </div>

    <div id="v-shop" class="page" style="display:none"><div class="glass"><h3>📦 МАГАЗИН</h3><div id="shop-list"></div></div></div>
    <div id="v-inv" class="page" style="display:none"><div class="glass"><h3>🎒 ІНВЕНТАР</h3><div id="inv-list"></div></div></div>
    <div id="v-top" class="page" style="display:none"><div class="glass"><h3>🏆 ТОП</h3><div id="leaderboard"></div></div></div>
    <div id="v-admin" class="page" style="display:none"><div class="glass"><h3>⚡ АДМІНКА</h3><div id="admin-list"></div></div></div>
</div>

<div id="odds-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center; padding:10px; box-sizing:border-box">
    <div class="glass"><h4 id="odds-title" style="margin:0 0 10px 0; color:var(--accent); text-align:center">Шанси</h4><div id="odds-list" style="font-size:14px;"></div><button class="btn" onclick="closeOdds()">ЗАКРИТИ</button></div>
</div>

<div id="case-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center; flex-direction:column; padding:20px; box-sizing:border-box">
    <h2 id="case-title" style="color:var(--accent)">ВІДКРИТТЯ...</h2>
    <div class="case-roulette"><div id="case-line"></div><div id="case-scroll"></div></div>
    <div id="case-res" style="margin-top:25px; font-size:20px; font-weight:bold"></div>
    <button class="btn" style="width:200px; display:none" id="case-close" onclick="closeCase()">ЗАБРАТИ</button>
</div>

<nav>
    <div class="nav-tab active" onclick="tab('main', this)">🎮</div>
    <div class="nav-tab" onclick="tab('shop', this)">📦</div>
    <div class="nav-tab" onclick="tab('inv', this)">🎒</div>
    <div class="nav-tab" onclick="tab('top', this)">🏆</div>
    <div id="admin-tab" class="nav-tab" style="display:none" onclick="tab('admin', this)">⚡</div>
</nav>

<script src="script.js?v=2.6"></script>
</body>
</html>
