<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEARS CASINO</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<header>
<div>
<div style="font-weight:900;color:white;">BEARS CASINO</div>
<div style="font-size:10px;color:var(--accent)">PET EVOLUTION</div>
</div>

<div class="bal-card"><span id="bal-val">0</span> BB</div>
</header>

<div class="container">

<div id="pet-display" class="glass">
<div id="p-img">🥚</div>
<div>
<div id="p-rarity" class="rarity-tag">НЕМАЄ</div>
<div id="p-name">Оберіть пета</div>
<div class="xp-bar"><div id="xp-f" class="xp-fill"></div></div>
<div>
x<span id="p-m">1</span> LVL <span id="p-l">1</span>
</div>
</div>
</div>

<div id="v-main" class="page">
<div class="glass">

<select id="g-sel" onchange="updUI()">
<option value="f50">50/50</option>
<option value="dice">Кубик</option>
<option value="wheel">Колесо</option>
</select>

<input type="number" id="bet-a" value="1">
<button class="btn" onclick="play()">ГРАТИ</button>

<div id="g-stat"></div>
</div>
</div>

<div id="v-shop" class="page" style="display:none">
<div class="shop-tabs">
<div class="s-tab active" onclick="setShop('cases',this)">Кейси</div>
<div class="s-tab" onclick="setShop('market',this)">Ринок</div>
</div>
<div id="shop-list"></div>
</div>

<div id="v-inv" class="page" style="display:none">
<div id="inv-list"></div>
</div>

<div id="v-admin" class="page" style="display:none">
<div id="admin-list"></div>
</div>

</div>

<nav>
<div class="nav-tab active" onclick="tab('main',this)">🎮</div>
<div class="nav-tab" onclick="tab('shop',this)">📦</div>
<div class="nav-tab" onclick="tab('inv',this)">🎒</div>
<div id="admin-tab" class="nav-tab" style="display:none" onclick="tab('admin',this)">⚡</div>
</nav>

<!-- КЕЙС Анімація -->
<div id="case-open">
<div id="case-line"></div>
<div id="case-result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
