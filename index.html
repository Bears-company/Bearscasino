<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>BEARS CASINO FIX</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<header>
    <div class="brand">BEARS CASINO</div>
    <div class="bal-card"><span id="bal-val">0</span> BB</div>
</header>

<div class="container">
    <div class="glass pet-card">
        <div id="p-img" style="font-size:40px">🥚</div>
        <div style="flex:1">
            <div id="p-name" style="font-weight:bold">Завантаження...</div>
            <div class="xp-bar"><div id="xp-f" class="xp-fill"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:10px">
                <span id="p-rarity">COMMON</span>
                <span>LVL: <b id="p-l">1</b></span>
            </div>
        </div>
    </div>

    <div id="v-main" class="page">
        <div class="glass">
            <select id="g-sel" class="game-select" onchange="updUI()">
                <option value="dice">🎲 Кубик (x2.05)</option>
                <option value="wheel">🎡 Колесо (x0 - x2)</option>
                <option value="bj">🃏 Блекджек (x2.0)</option>
            </select>

            <div id="ui-dice" class="g-zone">
                <div class="dice-grid">
                    <button class="d-btn active" onclick="selD(1, this)">1</button>
                    <button class="d-btn" onclick="selD(2, this)">2</button>
                    <button class="d-btn" onclick="selD(3, this)">3</button>
                    <button class="d-btn" onclick="selD(4, this)">4</button>
                    <button class="d-btn" onclick="selD(5, this)">5</button>
                    <button class="d-btn" onclick="selD(6, this)">6</button>
                </div>
            </div>

            <div id="ui-wheel" class="g-zone" style="display:none">
                <div class="w-wrap"><div class="ptr">▼</div><div id="w-obj" class="w-disk">
                    <div class="s s1">x0</div><div class="s s2">x2</div><div class="s s3">x0.5</div><div class="s s4">x1.5</div><div class="s s5">x0</div>
                </div></div>
            </div>

            <div id="ui-bj" class="g-zone" style="display:none">
                <div id="bj-dc" class="card-row"></div>
                <div id="bj-pc" class="card-row"></div>
                <div id="bj-ctrl" style="display:none; gap:10px; justify-content:center">
                    <button class="btn-s" onclick="bjStep('hit')">ЩЕ</button>
                    <button class="btn-s" onclick="bjStep('stand')" style="background:var(--error)">СТОП</button>
                </div>
            </div>

            <input type="number" id="bet-a" value="10" class="bet-input">
            <button class="btn-main" onclick="play()">ГРАТИ</button>
            <div id="g-res" style="text-align:center; margin-top:10px; font-weight:bold"></div>
        </div>
    </div>

    <div id="v-shop" class="page" style="display:none">
        <div class="shop-tabs">
            <button id="ts1" class="s-tab active" onclick="setS('c')">📦 КЕЙСИ</button>
            <button id="ts2" class="s-tab" onclick="setS('m')">🛒 РИНОК</button>
        </div>
        <div id="s-c" class="glass">
            <div class="item"><span>🥚 Common Egg</span><button onclick="buyEgg('basic')">250 BB</button></div>
        </div>
        <div id="s-m" style="display:none" class="glass">
            <div id="market-list"></div>
        </div>
    </div>

    <div id="v-inv" class="page" style="display:none">
        <div class="glass">
            <h3>🎒 ТВОЇ ПЕТИ</h3>
            <div id="inv-list"></div>
        </div>
    </div>

    <div id="v-admin" class="page" style="display:none">
        <div class="glass">
            <h3 style="color:var(--accent)">⚡ ADMIN PANEL</h3>
            <div id="admin-users"></div>
        </div>
    </div>
</div>

<nav>
    <div class="n-btn active" onclick="tab('main', this)">🎮</div>
    <div class="n-btn" onclick="tab('shop', this)">📦</div>
    <div class="n-btn" onclick="tab('inv', this)">🎒</div>
    <div id="adm-nav" class="n-btn" style="display:none" onclick="tab('admin', this)">⚡</div>
</nav>

<script src="script.js"></script>
</body>
</html>
