<div class="container">
    <div id="v-main" class="page">
        <div class="glass" style="text-align:center">
            <select id="g-sel" onchange="updUI()">
                <option value="dice">🎲 Кубик (Число 1-6) - x1.45</option>
                <option value="f50">⚖️ 50/50 - x1.45</option>
                <option value="wheel">🎡 Колесо (0 - x1.75)</option>
                <option value="bj">🃏 Блекджек - x2.0</option>
            </select>

            <div id="ui-dice" style="margin-top:10px">
                <p style="font-size:12px;color:#8d99ae">Вгадай число:</p>
                <div style="display:flex; justify-content:center; gap:5px">
                    <button class="n-btn" onclick="selN(1)">1</button>
                    <button class="n-btn" onclick="selN(2)">2</button>
                    <button class="n-btn" onclick="selN(3)">3</button>
                    <button class="n-btn" onclick="selN(4)">4</button>
                    <button class="n-btn" onclick="selN(5)">5</button>
                    <button class="n-btn" onclick="selN(6)">6</button>
                </div>
            </div>

            <div id="ui-wheel" style="display:none">
                <div class="w-wrap"><div class="marker"></div><div id="w-obj" class="w-main"></div></div>
                <div style="font-size:10px; color:#8d99ae; margin-top:5px">🔴0 | 🟢x1.25 | 🔵x1.5 | 🟡x1.75</div>
            </div>

            <div id="ui-bj" style="display:none; margin:15px 0">
                <div id="bj-dc"></div>
                <div style="margin:10px 0; border-top:1px solid var(--border)"></div>
                <div id="bj-pc"></div>
                <div id="bj-ctrl" style="display:none; gap:10px; margin-top:10px">
                    <button class="btn" style="flex:1" onclick="bjDo('hit')">ЩЕ</button>
                    <button class="btn" style="flex:1; background:#ff4d6d" onclick="bjDo('stand')">СТОП</button>
                </div>
            </div>

            <input type="number" id="bet-a" value="100">
            <button class="btn" id="b-play" onclick="play()">СТАВКА</button>
            <div id="g-stat" style="margin-top:15px; font-weight:bold; min-height:20px"></div>
        </div>
    </div>
    </div>
