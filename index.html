<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>BEARS CASINO: INVENTORY</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<header>
    <div>
        <div id="u-name" style="font-weight:900; font-size:18px">BEARS CASINO</div>
        <div id="u-rank" style="font-size:10px; color:#8d99ae">РАНГ: 1</div>
    </div>
    <div class="bal-card"><span id="bal-val">0</span> BB</div>
</header>

<div class="container">
    <div class="glass shadow-accent" style="display:flex; align-items:center; gap:15px; margin-bottom:10px; border:1px solid var(--accent)">
        <div id="p-img" style="font-size:40px">🥚</div>
        <div style="flex:1">
            <div id="p-rarity">НЕМАЄ</div>
            <div id="p-name" style="font-weight:bold">Обери пета</div>
            <div class="xp-bar"><div id="xp-f" class="xp-fill"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:12px">
                <span>Бонус: <span id="p-m" style="color:var(--accent)">x1.0</span></span>
                <span>Lvl: <span id="p-l">1</span></span>
            </div>
        </div>
    </div>

    <div id="v-main" class="page">
        <div class="glass">
            <select id="g-sel" onchange="updUI()">
                <option value="f50">⚖️ 50/50 (x1.45)</option>
                <option value="dice">🎲 Кубик (1-6) - x1.45</option>
                <option value="wheel">🎡 Колесо (До x1.75)</option>
                <option value="bj">🃏 Блекджек (x2.0)</option>
            </select>
            <div id="ui-dice" style="display:none; margin:15px 0;"><div class="dice-grid"></div></div>
            <div id="ui-wheel" style="display:none; text-align:center"><div class="w-wrap"><div class="marker"></div><div id="w-obj" class="w-main"></div></div></div>
            <div id="ui-bj" style="display:none; margin:20px 0; text-align:center">
                <div id="bj-dc" class="card-row"></div><div style="height:1px; background:var(--border); margin:10px 0"></div><div id="bj-pc" class="card-row"></div>
                <div id="bj-ctrl" style="display:none; gap:10px; margin-top:15px"><button class="btn" onclick="bjDo('hit')">ЩЕ</button><button class="btn" style="background:var(--error)" onclick="bjDo('stand')">СТОП</button></div>
            </div>
            <input type="number" id="bet-a" value="100">
            <button class="btn" id="b-play" onclick="play()">СТАВКА</button>
            <div id="g-stat" style="text-align:center; margin-top:15px; font-weight:900; min-height:24px"></div>
        </div>
    </div>

    <div id="v-shop" class="page" style="display:none">
        <div class="glass">
            <h3>🛒 МАГАЗИН</h3>
            <div class="shop-item"><span>Дерев'яне (2k)</span><button class="btn-s" onclick="buy('wood', 2000)">2k</button></div>
            <div class="shop-item"><span>Залізне (10k)</span><button class="btn-s" onclick="buy('iron', 10000)">10k</button></div>
            <div class="shop-item"><span>Діамантове (50k)</span><button class="btn-s" onclick="buy('diam', 50000)">50k</button></div>
        </div>
    </div>

    <div id="v-inv" class="page" style="display:none">
        <div class="glass">
            <h3>🎒 ІНВЕНТАР</h3>
            <div id="inv-list">Завантаження...</div>
        </div>
    </div>

    <div id="v-top" class="page" style="display:none">
        <div class="glass"><h3>🏆 ТОП 10</h3><div id="leaderboard"></div></div>
    </div>

    <div id="v-admin" class="page" style="display:none">
        <div class="glass"><h3>⚡ АДМІН-ПАНЕЛЬ</h3><div id="admin-list">...</div></div>
    </div>
</div>

<nav>
    <div class="nav-tab active" onclick="tab('main', this)">🎮</div>
    <div class="nav-tab" onclick="tab('shop', this)">🥚</div>
    <div class="nav-tab" onclick="tab('inv', this)">🎒</div>
    <div class="nav-tab" onclick="tab('top', this)">🏆</div>
    <div class="nav-tab" onclick="tab('admin', this)">⚡</div>
</nav>

<script src="script.js"></script>
</body>
</html>
