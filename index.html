<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bears Pet Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <header>
        <div>
            <b id="u-rank">Завантаження...</b>
            <div class="xp-bar"><div id="xp-f" class="xp-fill"></div></div>
        </div>
        <div class="bal-card"><span id="bal-val">0</span> BB</div>
    </header>

    <div class="container">
        <div id="v-main" class="page">
            <div class="card">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div id="p-img" style="font-size: 50px;">❓</div>
                    <div>
                        <b id="p-name">Немає пета</b><br>
                        <small id="p-rarity" style="color: #aaa;">Оберіть в інвентарі</small>
                    </div>
                </div>
                <div style="margin-top: 10px; font-size: 14px;">
                    Множник: <b id="p-m">1.000</b> | Рівень: <b id="p-l">1</b>
                </div>
            </div>

            <div class="card">
                <select id="g-sel" onchange="updUI()">
                    <option value="f50">50/50 (x1.55)</option>
                    <option value="dice">Кубик (x2.05)</option>
                </select>
                <div id="ui-dice" style="display:none; margin: 10px 0;">
                    <div class="dice-grid" id="dice-btns"></div>
                </div>
                <input type="number" id="bet-a" value="10" style="width: 100%; padding: 10px; margin: 10px 0;">
                <button class="btn" onclick="play()">ГРАТИ</button>
                <p id="g-stat" style="text-align:center; font-weight:bold; height: 20px;"></p>
            </div>
        </div>

        <div id="v-inv" class="page" style="display:none;">
            <h3>Ваші пети</h3>
            <div id="inv-list"></div>
        </div>

        <div id="v-top" class="page" style="display:none;">
            <h3>Топ гравців</h3>
            <div id="top-list"></div>
        </div>

        <div id="v-admin" class="page" style="display:none;">
            <h3>Адмін-панель</h3>
            <button class="btn-s" onclick="setATab('stats')">Статистика</button>
            <button class="btn-s" onclick="setATab('users')">Гравці</button>
            <hr>
            <div id="admin-content"></div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="tab('main', this)">🎮</div>
        <div class="nav-item" onclick="tab('inv', this)">📦</div>
        <div class="nav-item" onclick="tab('top', this)">🏆</div>
        <div id="admin-tab" class="nav-item" style="display:none;" onclick="tab('admin', this)">⚙️</div>
    </nav>

    <script>
        // ВСТАВ СВОЇ ДАНІ FIREBASE СЮДИ!
        const firebaseConfig = {
            apiKey: "API_KEY",
            authDomain: "PROJECT.firebaseapp.com",
            databaseURL: "https://PROJECT.firebaseio.com",
            projectId: "PROJECT",
            storageBucket: "PROJECT.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
