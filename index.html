<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEARS CASINO</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<header>
    <div>
        <div class="logo">BEARS CASINO</div>
        <div class="sub">PET EVOLUTION</div>
    </div>

    <div class="balance">
        <span id="bal">0</span> BB
    </div>
</header>

<div class="container">

<!-- PET -->
<div class="glass pet-box">
    <div id="pet-emoji">🥚</div>
    <div>
        <div id="pet-name">Немає пета</div>
        <div id="pet-m">x1.0</div>
    </div>
</div>

<!-- MAIN -->
<div id="main" class="page active">

<div class="glass">

<select id="game">
    <option value="coin">50/50</option>
    <option value="dice">Кубик</option>
    <option value="wheel">Колесо</option>
</select>

<input id="bet" type="number" value="10">

<button onclick="play()">ГРАТИ</button>

<div id="result"></div>

</div>
</div>

<!-- SHOP -->
<div id="shop" class="page">
<div class="glass" id="cases"></div>
</div>

<!-- INVENTORY -->
<div id="inv" class="page">
<div class="glass" id="inventory"></div>
</div>

</div>

<nav>
<div onclick="openTab('main')">🎮</div>
<div onclick="openTab('shop')">📦</div>
<div onclick="openTab('inv')">🎒</div>
</nav>

<!-- CASE -->
<div id="case">
<div id="line"></div>
<div id="win"></div>
</div>

<script src="script.js"></script>
</body>
</html>
